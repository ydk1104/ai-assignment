# 테스트 전용 스택. 개발용 스택(docker-compose.yml)과 겹치지 않게 따로 띄우고, test 컨테이너가 테스트를 실행한 뒤 종료한다.
#
#   npm run test:docker
#   (= up -d --build 로 스택을 띄우고 test 컨테이너 로그를 따라간 뒤 종료 코드를 확인. 자세한 건 scripts/test-docker.js)
#
# - 프로젝트 이름을 nest-app-test 로 따로 써서 컨테이너/네트워크/볼륨이 개발 스택과 분리된다 (끝나면 down -v 로 정리)
# - 호스트 포트를 열지 않아서 개발 스택이 떠 있어도 충돌하지 않는다 (필요한 통신은 전부 도커 네트워크 안에서)
# - API/워커는 development 모드: 토큰 생성 지연 10ms 고정, 토큰 내용 = 토큰 번호
# - 난수 seed를 고정한다 (TEST_SEED). 같은 seed면 토큰 수/실패 여부/실패 지점이 항상 같아서 테스트가 결정적이다.
#     test/seeds.json 의 main(42)    : 테스트에 쓰는 모든 maxTokens에서 실패하지 않는 seed
#     test/seeds.json 의 failure(120): 항상 생성 도중(maxTokens 1000이면 438번째)에 token_create_fail 이 나는 seed
#   scripts/test-docker.js 가 두 단계(main -> failure)를 차례로 실행하며 TEST_SEED / TEST_PHASE 를 넣어준다.
#   직접 실행하려면:  TEST_SEED=42 TEST_PHASE=main docker compose -p nest-app-test -f docker-compose.yml -f docker-compose.test.yml up -d --build
#                     docker compose -p nest-app-test logs -f test   (끝나면 down -v 로 정리)
#   주의: up --exit-code-from 은 쓰지 말 것. 컨테이너가 하나라도 종료되면 전체를 중단하는데, 장애 복구 테스트는 워커를 일부러 죽인다.
# - test 컨테이너에 도커 소켓을 마운트해서, 워커를 죽여 보는 장애 복구 테스트(test/e2e-failover.js)를 컨테이너 안에서 실행한다
# - Docker Compose v2.24 이상 필요 (`!reset` 태그)

services:
  nginx:
    ports: !reset []

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  api-1:
    environment:
      NODE_ENV: development
      INITIAL_CREDIT: "10000" # 테스트에서 "크레딧 부족"을 쉽게 만들 수 있도록 작게
      RANDOM_SEED: ${TEST_SEED:-} # .env 의 RANDOM_SEED 는 무시하고 테스트용 고정 seed 사용

  api-2:
    environment:
      NODE_ENV: development
      INITIAL_CREDIT: "10000" # 테스트에서 "크레딧 부족"을 쉽게 만들 수 있도록 작게
      RANDOM_SEED: ${TEST_SEED:-} # .env 의 RANDOM_SEED 는 무시하고 테스트용 고정 seed 사용

  worker:
    # 장애 복구 테스트(test/e2e-failover.js)가 워커를 kill 한다. 자동 재시작되면 "다른 워커가 이어받는지" 확인할 수 없으므로 끈다.
    # (테스트가 끝나면 죽인 워커를 직접 다시 시작한다)
    restart: "no"
    environment:
      NODE_ENV: development # seed는 API가 job에 담아 보내므로 워커에는 따로 필요 없다
      INITIAL_CREDIT: "10000"

  test:
    build:
      context: .
      target: test
    environment:
      NODE_ENV: development
      INITIAL_CREDIT: "10000" # 서버와 같은 값 (테스트가 잔액 기대값을 계산할 때 쓴다)
      RANDOM_SEED: ${TEST_SEED:-} # 테스트가 기대값(토큰 수, 실패 지점)을 계산할 때 쓴다
      TEST_PHASE: ${TEST_PHASE:-main}
      BASE_URL: http://nginx
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      DB_NAME: ${POSTGRES_DB:-app}
    # 워커 장애 복구 테스트가 Docker Engine API 로 워커 컨테이너를 kill/start 하기 위해 도커 소켓을 마운트한다.
    # 주의: 소켓을 마운트하면 이 컨테이너는 호스트의 도커를 제어할 수 있다. 격리된 테스트 스택에서만 쓰는 용도다.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nginx
