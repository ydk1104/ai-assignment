name: nest-app

x-app-env:
  &app-env # production: 토큰 생성 지연 20~80ms 무작위 / 그 외(development 등): 10ms 고정 (.env의 APP_ENV로 전환)
  NODE_ENV: ${APP_ENV:-production}
  PORT: 3000
  # PostgreSQL
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-app}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
  DB_NAME: ${POSTGRES_DB:-app}
  # Redis (BullMQ)
  REDIS_HOST: redis
  REDIS_PORT: 6379
  # 비워두면 시간 기반 랜덤, 정수를 넣으면 해당 seed로 고정
  RANDOM_SEED: ${RANDOM_SEED:-}
  # 새 유저에게 처음 지급하는 크레딧
  INITIAL_CREDIT: ${INITIAL_CREDIT:-100000}

x-app-base: &app-base
  build: .
  environment: *app-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

x-api-healthcheck: &api-healthcheck
  # 앞서 만든 GET /status 로 확인. alpine에는 curl이 없어서 busybox wget 사용
  # (localhost는 IPv6(::1)로 풀릴 수 있어 127.0.0.1 사용)
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/status"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 10s

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    restart: unless-stopped

  api-1:
    <<: *app-base
    command: ["node", "dist/main.js"]
    healthcheck: *api-healthcheck

  api-2:
    <<: *app-base
    command: ["node", "dist/main.js"]
    healthcheck: *api-healthcheck

  # 생성 워커: BullMQ Worker가 Redis 큐에서 job을 가져감 (nginx 불필요)
  worker:
    <<: *app-base
    command: ["node", "dist/worker.js"]
    deploy:
      replicas: 2

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432" # 로컬 개발용. 운영에서는 제거
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # BullMQ는 maxmemory-policy가 noeviction이어야 job이 유실되지 않음
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "6379:6379" # 로컬 개발용. 운영에서는 제거
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
