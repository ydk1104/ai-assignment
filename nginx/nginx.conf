events {
  worker_connections 1024;
}

http {
  # Docker 내장 DNS. 컨테이너가 재생성돼 IP가 바뀌어도 5초 안에 따라감
  resolver 127.0.0.11 valid=5s ipv6=off;

  # WebSocket 업그레이드 요청일 때만 Connection: upgrade 를 보냄
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # 구간별 시간 로그
  #   rt  = nginx가 요청을 처리한 전체 시간
  #   uct = nginx -> API 연결(TCP connect)까지 걸린 시간
  #   uht = API가 응답 헤더를 보낼 때까지 걸린 시간
  log_format timing '$remote_addr "$request" $status '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time '
                    'upstream=$upstream_addr';
  access_log /dev/stdout timing;

  upstream nest_api {
    zone nest_api 64k;   # resolve 사용에 필요
    # least_conn;   # 요청 처리 시간이 들쭉날쭉하면 주석 해제
    server api-1:3000 resolve max_fails=3 fail_timeout=10s;
    server api-2:3000 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;   # API로의 연결을 재사용 (요청마다 새로 연결하지 않음)
  }

  server {
    listen 80;

    location / {
      proxy_pass http://nest_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 1s;   # 죽은 IP로 연결을 시도해도 1초 만에 포기하고 다른 서버로 넘어감
      proxy_read_timeout 60s;
    }
  }
}